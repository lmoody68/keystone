<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEYSTONE ERP</title>
<style>
  :root{
    --bg:#eef2f7; --side:#0f172a; --side2:#1e293b; --sidehi:#334155; --card:#fff; --ink:#0f172a;
    --mut:#64748b; --line:#e4e9f0; --soft:#f6f8fb; --blue:#2563eb; --green:#16a34a; --red:#dc2626;
    --amber:#d97706; --gold:#eab308; --mono:'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-size:18px;font-weight:800;color:#fff;letter-spacing:.5px}
  .ks{width:26px;height:22px;background:linear-gradient(180deg,var(--gold),var(--amber));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);flex:0 0 auto}
  .logo small{display:block;font-size:10px;color:#94a3b8;font-weight:600;letter-spacing:.3px;margin-top:1px}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:1px}
  .navsec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:12px 10px 5px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13.5px;cursor:pointer}
  .nav a .i{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:var(--side2);color:#fff}
  .nav a.on{background:var(--blue);color:#fff;font-weight:600}
  .sidefoot{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #1e293b}
  .sidefoot b{color:#cbd5e1}
  /* main */
  .main{padding:0}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top h1{font-size:18px;margin:0}
  .top .sub{color:var(--mut);font-size:12.5px}
  .top .stat{margin-left:auto;display:flex;gap:16px;font-size:12px;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
  .dot.off{background:var(--mut)}
  .view{padding:22px 24px 60px;max-width:1280px}
  .databanner{background:#fdf6e3;border-bottom:1px solid #f0e3c0;color:#8a6d1a;font-size:12px;padding:7px 24px;display:flex;align-items:center;gap:7px;position:sticky;top:0;z-index:4}
  .databanner b{color:#6b540f}
  /* shared */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
  .kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.blue .v{color:var(--blue)} .kpi.amber .v{color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .card h2{margin:0;padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h2 .tag{margin-left:auto;font-weight:600;font-size:11px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 16px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 16px;border-bottom:1px solid var(--soft);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
  .pill.red{background:#fde8e8;color:var(--red)} .pill.green{background:#e6f5ec;color:var(--green)}
  .pill.amber{background:#fdf0e0;color:var(--amber)} .pill.gray{background:#eef2f6;color:var(--mut)} .pill.blue{background:#e7effd;color:var(--blue)}
  .amt.red{color:var(--red);font-weight:700} .amt.green{color:var(--green);font-weight:700}
  .bar{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;font-size:12px}
  .legend b{font-variant-numeric:tabular-nums}
  .flagrow{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--soft);font-size:13px}
  .flagrow:last-child{border-bottom:none}
  .flagrow .sm{color:var(--mut);font-size:11.5px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--amber));color:#3a2a00}
  input,textarea,select{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--blue)}
  .muted{color:var(--mut);font-size:12.5px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  /* profile cards */
  .profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:900px){.profiles{grid-template-columns:1fr}}
  .prof{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .prof h3{margin:0 0 3px;font-size:15px}
  .prof .ind{color:var(--blue);font-size:12px;font-weight:600;margin-bottom:8px}
  .prof .row{font-size:12.5px;margin:4px 0;color:#334155}
  .prof .row b{color:var(--ink)}
  .prof .src{font-size:10.5px;color:var(--mut);margin-top:9px;border-top:1px solid var(--soft);padding-top:7px}
  .realbadge{background:#e6f5ec;color:var(--green);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
  /* copilot */
  .chat{height:52vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
  .msg{max-width:80%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--blue);color:#fff}
  .msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .msg.a b{color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
  .chip{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;cursor:pointer;color:var(--blue)}
  .chip:hover{background:#f0f6fc}
  .ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  /* design studio */
  .studio{display:grid;grid-template-columns:360px 1fr;gap:18px}
  @media(max-width:900px){.studio{grid-template-columns:1fr}}
  .render{background:var(--soft);border:1px dashed var(--line);border-radius:12px;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .render img{width:100%;height:100%;object-fit:cover;border-radius:11px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:50}
  .toast.on{opacity:1}
  /* clickable rows + detail drawer */
  .clickrow{cursor:pointer;transition:background .1s}
  .clickrow:hover{background:#f0f6fc}
  .clickrow:hover td:last-child::after{content:'›';position:absolute;right:6px;color:var(--mut);font-weight:700}
  .clickrow td:last-child{position:relative}
  .drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.38);opacity:0;visibility:hidden;transition:.2s;z-index:40}
  .drawer-bg.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:93vw;background:var(--card);box-shadow:-10px 0 34px rgba(15,23,42,.2);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:41;overflow:auto}
  .drawer.open{transform:none}
  .dhead{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 15px;border-bottom:1px solid var(--line)}
  .dhead h3{margin:3px 0 0;font-size:20px}
  .dkind{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:800}
  .dsub{color:var(--mut);font-size:13px;margin-top:3px}
  .dx{margin-left:auto;background:var(--soft);border:0;border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--mut);flex:0 0 auto}
  .dx:hover{background:#e9eef5}
  .dfields{padding:6px 22px}
  .df{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:13.5px}
  .df:last-child{border-bottom:none}
  .df span{color:var(--mut)} .df b{font-variant-numeric:tabular-nums;text-align:right}
  .dnote{margin:6px 22px 0;padding:10px 12px;background:var(--soft);border-radius:9px;font-size:12.5px;color:var(--mut)}
  .dactions{padding:16px 22px;display:flex;flex-direction:column;gap:9px}
  .dactions .btn{width:100%}
  #dfoot{padding:0 22px 24px}
  .confirmbar{background:#f4f7f5;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:13px}
  .dresult{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.55;white-space:pre-wrap}
  .dresult.ok{background:#e9f7ec;color:#166534} .dresult.err{background:#fde8e8;color:var(--red)}
  /* interpreter */
  .xlate{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  .xmeta{font-size:11.5px;color:var(--mut);margin-bottom:5px}
  .xtext{font-size:15px;line-height:1.5;white-space:pre-wrap}
  textarea{resize:vertical;font-family:inherit}
  .btn.rec{background:var(--red)!important;color:#fff!important;animation:recp 1s infinite}
  @keyframes recp{50%{opacity:.55}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="ks"></div><div>KEYSTONE<small>ERP · Burns Companies</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">QuickBooks: <b id="qbstat">sandbox</b><br>Books as of <b id="asof">…</b></div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="mtitle">Dashboard</h1><div class="sub" id="msub">Group overview across all companies</div></div>
      <select id="srcsel" style="margin-left:20px;width:auto;font-weight:600" disabled title="Connect QuickBooks to enable live data">
        <option value="">📊 Demo data</option>
        <option value="qb">🟢 Live QuickBooks</option>
      </select>
      <select id="cosel" style="margin-left:10px;width:auto;max-width:250px;font-weight:600">
        <option value="">🏢 All companies (group)</option>
        <option value="wayne">Wayne Contracting</option>
        <option value="mhard">Meramec Hardscapes</option>
        <option value="mpool">Meramec Pools &amp; Outdoors</option>
        <option value="vizex">Vizex</option>
        <option value="csw">City Seafood (Wholesale)</option>
        <option value="csr">City Seafood (Retail)</option>
      </select>
      <div class="stat">
        <span><span class="dot" id="aidot"></span>AI copilot</span>
        <span><span class="dot" id="imgdot"></span>Renderings</span>
      </div>
    </div>
    <div class="databanner" id="banner">ℹ️ <span><b>Demo data.</b> Company profiles are real &amp; sourced; all dollar figures are modeled sample data — not Burns' actual financials. Connect QuickBooks for live numbers.</span></div>
    <div class="view" id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="drawer-bg" id="drawerbg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><div id="drawerbody"></div></aside>

<script>
const $=s=>document.querySelector(s);
const M=n=> (Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?'$'+Math.round(n/1e3)+'K':'$'+Math.round(n));
const F=n=>'$'+Math.round(n).toLocaleString();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let CO='';            // selected company id ('' = consolidated group)
let CUR='dashboard';  // current module
const CONAME={wayne:'Wayne Contracting',mhard:'Meramec Hardscapes',mpool:'Meramec Pools & Outdoors',vizex:'Vizex',csw:'City Seafood (Wholesale)',csr:'City Seafood (Retail)'};
let SRC='';           // '' = demo (Burns model), 'qb' = live QuickBooks
let PEND_SCHED=null;  // employee name to pre-select in the Schedule-a-meeting form (set from a drawer)
const SCOPED=['/api/overview','/api/jobs','/api/ar','/api/ap','/api/inventory','/api/po','/api/crm','/api/vendors','/api/directory','/api/calendar'];
const get=u=>{ if(SCOPED.some(p=>u.startsWith(p))){ if(SRC) u+=(u.includes('?')?'&':'?')+'source='+SRC; else if(CO) u+=(u.includes('?')?'&':'?')+'company='+CO; } return fetch(u).then(r=>r.json()); };
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
function tbl(head,rows){return `<div style="overflow:auto"><table><tr>${head}</tr>${rows}</table></div>`;}

// ---------- DETAIL DRAWER (click any row to drill in + act) ----------
const STORE={};                 // kind -> list of row objects (set by each module)
let DREF=null;                  // {kind,i,actions} currently open
function clk(kind,i){ return `class="clickrow" onclick="openDetail('${kind}',${i})"`; }

function buildDetail(kind,o){
 const money=v=>(v>0?F(v):'—');
 switch(kind){
  case 'po': return {kind:'Purchase Order',title:o.id,sub:(o.vendor||'')+' · '+(o.company_name||''),
    fields:[['Vendor',esc(o.vendor)],['Company',esc(o.company_name||'—')],['Amount',F(o.amount),'amt green'],['Date',esc(o.date||'—')]],
    actions:[{label:'🧾 Convert to vendor bill',action:'create_bill',params:{vendor:o.vendor,amount:o.amount,description:'From '+o.id},summary:`Post a ${F(o.amount)} vendor bill from ${o.vendor} (converted from ${o.id}).`}]};
  case 'inv':{ const od=o.status==='overdue'; const a=[{label:'💵 Record payment',action:'record_payment',params:{customer:o.customer,amount:o.amount},summary:`Record a ${F(o.amount)} payment from ${o.customer}, applied to ${o.id}.`}];
    if(od)a.push({label:'✉️ Send payment reminder',action:'send_reminder',params:{customer:o.customer,amount:o.amount,days:o.days_past_due},summary:`Send a payment reminder to ${o.customer} for ${F(o.amount)} (${o.days_past_due} days overdue).`});
    return {kind:'Invoice',title:o.id,sub:o.customer,fields:[['Customer',esc(o.customer)],['Company',esc(o.company_name||'—')],['Amount',F(o.amount),'amt'],['Status',o.status],['Days past due',o.days_past_due||'—']],actions:a}; }
  case 'draft': return {kind:'Invoice draft',title:o.customer,sub:o.job,
    fields:[['Customer',esc(o.customer)],['Company',esc(o.company)],['Job',esc(o.job)],['% complete',(o.pct_complete||0)+'%'],['Billable now',F(o.amount),'amt green'],['Terms','Net '+o.terms_days]],
    actions:[{label:'📄 Create this invoice in QuickBooks',action:'create_invoice',params:{customer:o.customer,amount:o.amount,description:o.job+' ('+o.pct_complete+'% complete)'},summary:`Create a ${F(o.amount)} invoice for ${o.customer} — ${o.job}.`}]};
  case 'bill': return {kind:'Vendor bill',title:o.id,sub:o.vendor,
    fields:[['Vendor',esc(o.vendor)],['Company',esc(o.company_name||'—')],['Amount',F(o.amount),'amt'],['Status',o.status],['Days past due',o.days_past_due||'—']],
    note:'Bills are tracked here; recording a bill as paid happens in QuickBooks.',actions:[]};
  case 'cust':{ const a=[]; if(o.open>0)a.push({label:'💵 Record payment',action:'record_payment',params:{customer:o.customer,amount:o.open},summary:`Record a ${F(o.open)} payment from ${o.customer}.`});
    if(o.overdue>0)a.push({label:'✉️ Send payment reminder',action:'send_reminder',params:{customer:o.customer,amount:o.overdue},summary:`Send a payment reminder to ${o.customer} for ${F(o.overdue)} overdue.`});
    return {kind:'Customer',title:o.customer,sub:o.company,fields:[['Total invoiced',F(o.invoiced)],['Open balance',money(o.open),'amt'],['Overdue',money(o.overdue),o.overdue>0?'amt red':'']],actions:a}; }
  case 'vend': return {kind:'Vendor',title:o.vendor,sub:o.company,
    fields:[['Total billed',F(o.billed)],['Open payable',money(o.open),o.open>0?'amt amber':'']],
    note:'To raise a PO or post a bill to this vendor, tell the copilot the amount (e.g. "raise a PO to '+o.vendor+' for $4,000").',actions:[]};
  case 'job':{ const a=[]; if(o.under_billed>0)a.push({label:'📄 Invoice this job',action:'create_invoice',params:{customer:o.customer,amount:o.under_billed,description:o.name+' progress billing ('+o.pct_complete+'%)'},summary:`Create a ${F(o.under_billed)} invoice for ${o.customer} — ${o.name}.`});
    return {kind:'Job'+(o.over_budget?' ⚠️ over budget':''),title:o.name,sub:(o.company_name||'')+' · '+(o.customer||''),
    fields:[['Company',esc(o.company_name)],['Customer',esc(o.customer)],['Contract',F(o.contract)],['% complete',o.pct_complete+'%'],['Budget cost',F(o.budget_cost)],['Actual cost',F(o.actual_cost)],['Variance',(o.cost_variance>0?'+':'')+F(o.cost_variance),o.cost_variance>0?'amt red':'amt green'],['Proj. margin',o.proj_margin_pct+'%'],['Un-billed',money(o.under_billed),o.under_billed>0?'amt green':'']],actions:a}; }
  case 'item': return {kind:'Inventory item',title:o.item,sub:o.low_stock?'⚠️ Below reorder point':'In stock',
    fields:[['On hand',o.qty_on_hand],['Reorder point',o.reorder_point],['Unit cost',F(o.unit_cost)],['Value',F(o.value)],['Status',o.low_stock?'Reorder':'OK',o.low_stock?'amt red':'amt green']],
    note:o.low_stock?'Stock is below the reorder point — consider raising a purchase order to restock.':'',actions:[]};
  case 'slow':{ const a=[{label:'✉️ Send payment reminder',action:'send_reminder',params:{customer:o.customer,amount:o.overdue},summary:`Send a payment reminder to ${o.customer} for ${F(o.overdue)} overdue.`},{label:'💵 Record payment',action:'record_payment',params:{customer:o.customer,amount:o.overdue},summary:`Record a ${F(o.overdue)} payment from ${o.customer}.`}];
    return {kind:'Slow payer',title:o.customer,sub:o.company,fields:[['Company',esc(o.company)],['Overdue',F(o.overdue),'amt red']],actions:a}; }
  case 'emp': return {kind:'Employee',title:o.name,sub:(o.title||'')+' · '+(o.company_name||''),
    fields:[['Title',esc(o.title)],['Department',esc(o.dept||'—')],['Company',esc(o.company_name)],['Phone',esc(o.phone)],['Email',esc(o.email)],['Location',esc(o.location||'—')],['Status',o.status]],
    note:o.status_detail?('Currently: '+esc(o.status_detail)):'',
    actions:[{label:'📞 Call '+esc(o.phone),cls:'ghost',action:'_tel',params:{v:o.phone},summary:''},
             {label:'✉️ Email '+esc((o.name||'').split(' ')[0]),cls:'ghost',action:'_mail',params:{v:o.email},summary:''},
             {label:'📅 Schedule a meeting',action:'_sched',params:{v:o.name},summary:''}]};
  case 'co': return {kind:'Company',title:o.name,sub:o.industry,
    fields:[['Active jobs',o.active_jobs],['Contract value',F(o.contract_value)],['Un-billed',money(o.under_billed),'amt green'],['Open A/R',F(o.open_ar)],['Overdue A/R',money(o.overdue_ar),o.overdue_ar>0?'amt red':'']],
    actions:[{label:'🔎 View this company only',cls:'ghost',action:'_scope',params:{id:o.id},summary:''}]};
 }
 return {kind:'Record',title:'Detail',sub:'',fields:Object.entries(o).map(([k,v])=>[k,esc(''+v)]),actions:[]};
}

function openDetail(kind,i){
 const o=(STORE[kind]||[])[i]; if(!o)return;
 const d=buildDetail(kind,o); DREF={kind,i,actions:d.actions};
 $('#drawerbody').innerHTML=`<div class="dhead"><div><div class="dkind">${d.kind}</div><h3>${esc(d.title)}</h3>${d.sub?`<div class="dsub">${esc(d.sub)}</div>`:''}</div><button class="dx" onclick="closeDrawer()">✕</button></div>

function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerbg').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDrawer(); });

function drawerAct(ai){
 const a=DREF.actions[ai];
 if(a.action==='_scope'){ closeDrawer(); $('#cosel').value=a.params.id||''; $('#cosel').dispatchEvent(new Event('change')); return; }
 if(a.action==='_tel'){ window.location.href='tel:'+(a.params.v||'').replace(/[^0-9+]/g,''); return; }
 if(a.action==='_mail'){ window.location.href='mailto:'+(a.params.v||''); return; }
 if(a.action==='_sched'){ closeDrawer(); PEND_SCHED=a.params.v||null; route('calendar'); return; }
 $('#dactions').style.display='none';
 const f=$('#dfoot');
 f.innerHTML=`<div class="confirmbar">⚡ <b>Confirm action</b><div style="margin:6px 0 11px">${esc(a.summary)}</div>
   <button class="btn" style="background:var(--green)" id="dgo">✅ Confirm — post to QuickBooks</button> <button class="btn ghost" id="dno" style="width:auto">Cancel</button></div>`;
 $('#dno').onclick=()=>{ f.innerHTML=''; $('#dactions').style.display=''; };
 $('#dgo').onclick=async()=>{
   f.innerHTML='<div class="confirmbar"><span class="spin"></span> posting to QuickBooks…</div>';
   try{ const res=await post('/api/action/execute',{action:a.action,params:a.params});
     f.innerHTML=`<div class="dresult ${res.ok?'ok':'err'}">${res.ok?cmd(res.message):('⚠️ '+esc(res.error||'failed'))}</div>`;
     if(res.ok){ toast('✅ Done'); setTimeout(()=>route(CUR),1500); }
   }catch(e){ f.innerHTML='<div class="dresult err">⚠️ error posting to QuickBooks</div>'; }
 };
}

function agingBars(a){
 const o=[['current','#16a34a'],['1-30','#84cc16'],['31-60','#eab308'],['61-90','#f97316'],['90+','#dc2626']];
 const t=Object.values(a).reduce((x,y)=>x+y,0)||1;
 let bar='<div class="bar">';o.forEach(([k,c])=>{const w=a[k]/t*100;if(w>0)bar+=`<i style="width:${w}%;background:${c}"></i>`;});bar+='</div>';
 let leg='<div class="legend">';o.forEach(([k,c])=>leg+=`<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:5px"></span>${k}: <b>${M(a[k])}</b></span>`);leg+='</div>';
 return bar+leg;
}

const LANGS=[['English','en-US'],['French','fr-FR'],['Spanish','es-ES'],['German','de-DE'],['Italian','it-IT'],
 ['Portuguese','pt-BR'],['Mandarin Chinese','zh-CN'],['Cantonese','zh-HK'],['Japanese','ja-JP'],['Korean','ko-KR'],
 ['Arabic','ar-SA'],['Hindi','hi-IN'],['Russian','ru-RU'],['Dutch','nl-NL'],['Polish','pl-PL'],['Vietnamese','vi-VN'],
 ['Tagalog','fil-PH'],['Ukrainian','uk-UA'],['Haitian Creole','ht-HT'],['Somali','so-SO']];
let DEFLANG='English', DEFCODE='en-US';   // recipient's default language (Email module)
let REC=null;
function listen(el,langCode,btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('🎤 Voice needs Chrome or Edge');return;}
 if(REC){REC.stop();REC=null;if(btn)btn.classList.remove('rec');return;}
 REC=new SR();REC.lang=langCode;REC.interimResults=true;REC.continuous=false;
 if(btn)btn.classList.add('rec');
 REC.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;el.value=t;};
 REC.onend=()=>{REC=null;if(btn)btn.classList.remove('rec');};
 REC.onerror=()=>{REC=null;if(btn)btn.classList.remove('rec');toast('🎤 mic error — check permissions');};
 REC.start();
}
function speak(text,langCode){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang=langCode||'en-US';u.rate=.98;speechSynthesis.speak(u);
}
function vInterpret(){
 const opts=LANGS.filter(l=>l[1]!=='en-US').map(l=>`<option value="${l[1]}">${l[0]}</option>`).join('');
 $('#main').innerHTML=`

    <div class="muted" style="line-height:1.6">Communicate with customers in any language. What the customer says (spoken or typed) is translated into English for you; your English reply is translated into their language — so you both understand each other. 🎤 to speak, 🔊 to hear it.</div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>Customer's language:</b>
      <select id="clang" style="width:auto;font-weight:600">${opts}</select></div></div>
  <div class="grid2">
    <div class="card"><h2>🗣️ Customer → English</h2><div style="padding:14px 16px">
      <textarea id="inA" rows="4" placeholder="Type what the customer said, or tap 🎤 to listen in their language…"></textarea>
      <div style="display:flex;gap:8px;margin-top:9px"><button class="btn ghost" id="micA">🎤 Listen</button><button class="btn" id="goA">Translate → English</button></div>
      <div id="outA" class="xlate" style="display:none"></div></div></div>
    <div class="card"><h2>✍️ Your reply → <span id="cl2"></span></h2><div style="padding:14px 16px">
      <textarea id="inB" rows="4" placeholder="Type your reply in English, or tap 🎤…"></textarea>
      <div style="display:flex;gap:8px;margin-top:9px"><button class="btn ghost" id="micB">🎤 Listen</button><button class="btn" id="goB">Translate → their language</button></div>
      <div id="outB" class="xlate" style="display:none"></div></div></div>
  </div>`;
 const clang=()=>$('#clang').value, clangName=()=>$('#clang').selectedOptions[0].text;
 $('#cl2').textContent=clangName();
 $('#clang').onchange=()=>$('#cl2').textContent=clangName();
 $('#micA').onclick=function(){listen($('#inA'),clang(),this);};
 $('#micB').onclick=function(){listen($('#inB'),'en-US',this);};
 $('#goA').onclick=()=>doXlate($('#inA').value,'English','#outA','en-US','#goA');
 $('#goB').onclick=()=>doXlate($('#inB').value,clangName(),'#outB',clang(),'#goB');
}
async function doXlate(text,to,outSel,speakCode,btnSel){
 text=(text||'').trim(); if(!text){toast('Type or speak something first');return;}
 const out=$(outSel),btn=$(btnSel); out.style.display='block'; out.innerHTML='<span class="spin"></span> translating…'; btn.disabled=true;
 try{const r=await post('/api/translate',{text,to});
   if(r.error){out.innerHTML='⚠️ '+esc(r.error);}
   else{
     out.innerHTML=`<div class="xmeta">detected: <b>${esc(r.source_language)}</b> &nbsp;→&nbsp; ${esc(to)}</div><div class="xtext">${esc(r.translation)}</div>
       <div style="margin-top:9px;display:flex;gap:8px"><button class="btn ghost" data-speak>🔊 Speak</button><button class="btn ghost" data-copy>📋 Copy</button></div>`;
     out.querySelector('[data-speak]').onclick=()=>speak(r.translation,speakCode);
     out.querySelector('[data-copy]').onclick=()=>{navigator.clipboard.writeText(r.translation);toast('Copied');};
     speak(r.translation,speakCode);
   }
 }catch(e){out.innerHTML='⚠️ translation error';}
 btn.disabled=false;
}

function updateBanner(){
 const b=$('#banner'); if(!b) return;
 if(SRC==='qb'){ b.innerHTML='🟢 <span><b>Live QuickBooks data.</b> These figures are pulled in real time from your connected QuickBooks Online company via the API.</span>'; b.style.background='#e9f7ec'; b.style.borderColor='#bfe6c6'; b.style.color='#1a6e2e'; }
 else { b.innerHTML="ℹ️ <span><b>Demo data.</b> Company profiles are real &amp; sourced; all dollar figures are modeled sample data — not Burns' actual financials. Switch to Live QuickBooks for real numbers.</span>"; b.style.background='#fdf6e3'; b.style.borderColor='#f0e3c0'; b.style.color='#8a6d1a'; }
}
async function boot(){
 buildNav();
 $('#cosel').onchange=e=>{CO=e.target.value; route(CUR);};
 $('#srcsel').onchange=e=>{ SRC=e.target.value; $('#cosel').style.display=SRC==='qb'?'none':''; if(SRC==='qb')CO=''; updateBanner(); route(CUR); };
 try{const h=await get('/api/health');
   $('#asof').textContent=h.as_of;
   $('#qbstat').textContent=h.qb_connected?'● connected (live)':'sandbox (demo)';
   $('#aidot').className='dot '+(h.llm_ready?'':'off');$('#imgdot').className='dot '+(h.image_ready?'':'off');
   if(h.qb_connected){ $('#srcsel').disabled=false; $('#srcsel').title='Switch between demo and live QuickBooks data'; }
 }catch(e){}
 route('dashboard');
}
boot();
