<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEYSTONE ERP</title>
<style>
  :root{
    --bg:#eef2f7; --side:#0f172a; --side2:#1e293b; --sidehi:#334155; --card:#fff; --ink:#0f172a;
    --mut:#64748b; --line:#e4e9f0; --soft:#f6f8fb; --blue:#2563eb; --green:#16a34a; --red:#dc2626;
    --amber:#d97706; --gold:#eab308; --mono:'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-size:18px;font-weight:800;color:#fff;letter-spacing:.5px}
  .ks{width:26px;height:22px;background:linear-gradient(180deg,var(--gold),var(--amber));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);flex:0 0 auto}
  .logo small{display:block;font-size:10px;color:#94a3b8;font-weight:600;letter-spacing:.3px;margin-top:1px}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:1px}
  .navsec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:12px 10px 5px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13.5px;cursor:pointer}
  .nav a .i{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:var(--side2);color:#fff}
  .nav a.on{background:var(--blue);color:#fff;font-weight:600}
  .sidefoot{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #1e293b}
  .sidefoot b{color:#cbd5e1}
  /* main */
  .main{padding:0}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top h1{font-size:18px;margin:0}
  .top .sub{color:var(--mut);font-size:12.5px}
  .top .stat{margin-left:auto;display:flex;gap:16px;font-size:12px;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
  .dot.off{background:var(--mut)}
  .view{padding:22px 24px 60px;max-width:1280px}
  .databanner{background:#fdf6e3;border-bottom:1px solid #f0e3c0;color:#8a6d1a;font-size:12px;padding:7px 24px;display:flex;align-items:center;gap:7px;position:sticky;top:0;z-index:4}
  .databanner b{color:#6b540f}
  /* shared */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
  .kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.blue .v{color:var(--blue)} .kpi.amber .v{color:var(--amber)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .card h2{margin:0;padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h2 .tag{margin-left:auto;font-weight:600;font-size:11px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 16px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 16px;border-bottom:1px solid var(--soft);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
  .pill.red{background:#fde8e8;color:var(--red)} .pill.green{background:#e6f5ec;color:var(--green)}
  .pill.amber{background:#fdf0e0;color:var(--amber)} .pill.gray{background:#eef2f6;color:var(--mut)} .pill.blue{background:#e7effd;color:var(--blue)}
  .amt.red{color:var(--red);font-weight:700} .amt.green{color:var(--green);font-weight:700}
  .bar{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;font-size:12px}
  .legend b{font-variant-numeric:tabular-nums}
  .flagrow{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--soft);font-size:13px}
  .flagrow:last-child{border-bottom:none}
  .flagrow .sm{color:var(--mut);font-size:11.5px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--amber));color:#3a2a00}
  input,textarea,select{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--blue)}
  .muted{color:var(--mut);font-size:12.5px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  /* profile cards */
  .profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:900px){.profiles{grid-template-columns:1fr}}
  .prof{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .prof h3{margin:0 0 3px;font-size:15px}
  .prof .ind{color:var(--blue);font-size:12px;font-weight:600;margin-bottom:8px}
  .prof .row{font-size:12.5px;margin:4px 0;color:#334155}
  .prof .row b{color:var(--ink)}
  .prof .src{font-size:10.5px;color:var(--mut);margin-top:9px;border-top:1px solid var(--soft);padding-top:7px}
  .realbadge{background:#e6f5ec;color:var(--green);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
  /* copilot */
  .chat{height:52vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
  .msg{max-width:80%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--blue);color:#fff}
  .msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .msg.a b{color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
  .chip{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;cursor:pointer;color:var(--blue)}
  .chip:hover{background:#f0f6fc}
  .ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  /* design studio */
  .studio{display:grid;grid-template-columns:360px 1fr;gap:18px}
  @media(max-width:900px){.studio{grid-template-columns:1fr}}
  .render{background:var(--soft);border:1px dashed var(--line);border-radius:12px;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .render img{width:100%;height:100%;object-fit:cover;border-radius:11px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:50}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="ks"></div><div>KEYSTONE<small>ERP · Burns Companies</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">QuickBooks: <b id="qbstat">sandbox</b><br>Books as of <b id="asof">…</b></div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="mtitle">Dashboard</h1><div class="sub" id="msub">Group overview across all companies</div></div>
      <select id="srcsel" style="margin-left:20px;width:auto;font-weight:600" disabled title="Connect QuickBooks to enable live data">
        <option value="">📊 Demo data</option>
        <option value="qb">🟢 Live QuickBooks</option>
      </select>
      <select id="cosel" style="margin-left:10px;width:auto;max-width:250px;font-weight:600">
        <option value="">🏢 All companies (group)</option>
        <option value="wayne">Wayne Contracting</option>
        <option value="mhard">Meramec Hardscapes</option>
        <option value="mpool">Meramec Pools &amp; Outdoors</option>
        <option value="vizex">Vizex</option>
        <option value="csw">City Seafood (Wholesale)</option>
        <option value="csr">City Seafood (Retail)</option>
      </select>
      <div class="stat">
        <span><span class="dot" id="aidot"></span>AI copilot</span>
        <span><span class="dot" id="imgdot"></span>Renderings</span>
      </div>
    </div>
    <div class="databanner" id="banner">ℹ️ <span><b>Demo data.</b> Company profiles are real &amp; sourced; all dollar figures are modeled sample data — not Burns' actual financials. Connect QuickBooks for live numbers.</span></div>
    <div class="view" id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const M=n=> (Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?'$'+Math.round(n/1e3)+'K':'$'+Math.round(n));
const F=n=>'$'+Math.round(n).toLocaleString();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let CO='';            // selected company id ('' = consolidated group)
let CUR='dashboard';  // current module
const CONAME={wayne:'Wayne Contracting',mhard:'Meramec Hardscapes',mpool:'Meramec Pools & Outdoors',vizex:'Vizex',csw:'City Seafood (Wholesale)',csr:'City Seafood (Retail)'};
let SRC='';           // '' = demo (Burns model), 'qb' = live QuickBooks
const SCOPED=['/api/overview','/api/jobs','/api/ar','/api/ap','/api/inventory','/api/po','/api/crm','/api/vendors'];
const get=u=>{ if(SCOPED.some(p=>u.startsWith(p))){ if(SRC) u+=(u.includes('?')?'&':'?')+'source='+SRC; else if(CO) u+=(u.includes('?')?'&':'?')+'company='+CO; } return fetch(u).then(r=>r.json()); };
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
function tbl(head,rows){return `<div style="overflow:auto"><table><tr>${head}</tr>${rows}</table></div>`;}

const NAV=[
 {sec:'Overview'},
 {id:'dashboard',label:'Dashboard',icon:'📊',sub:'Group overview across all companies'},
 {id:'companies',label:'Companies',icon:'🏢',sub:'The 7 Burns operating companies (real profiles)'},
 {sec:'Operations'},
 {id:'jobs',label:'Job Costing',icon:'🏗️',sub:'Budget vs actual on every job'},
 {id:'ar',label:'Invoicing / AR',icon:'🧾',sub:'Receivables, aging, DSO, ready-to-send invoices'},
 {id:'ap',label:'Bills / AP',icon:'💳',sub:'Vendor bills payable & aging'},
 {id:'po',label:'Purchase Orders',icon:'📦',sub:'Open commitments to vendors'},
 {id:'inventory',label:'Inventory',icon:'🐟',sub:'City Seafood stock & valuation'},
 {sec:'Relationships'},
 {id:'crm',label:'Customers',icon:'👥',sub:'Customer balances & history (CRM)'},
 {id:'vendors',label:'Vendors',icon:'🚚',sub:'Supplier spend & payables'},
 {sec:'AI & Integrations'},
 {id:'copilot',label:'AI Copilot',icon:'🤖',sub:'Ask anything about the books'},
 {id:'studio',label:'Design Studio',icon:'🎨',sub:'AI pool & outdoor renderings (Meramec Pools)'},
 {id:'email',label:'Email → ERP',icon:'📧',sub:'Turn vendor-invoice emails into bills automatically'},
 {id:'qbsync',label:'QuickBooks Sync',icon:'🔌',sub:'Two-way sync with QuickBooks Online'},
 {sec:'Help'},
 {id:'guide',label:'User Guide',icon:'📖',sub:'What KEYSTONE is and how to use every feature'},
];
const META=Object.fromEntries(NAV.filter(n=>n.id).map(n=>[n.id,n]));

function buildNav(){
 $('#nav').innerHTML=NAV.map(n=>n.sec?`<div class="navsec">${n.sec}</div>`:
   `<a data-id="${n.id}"><span class="i">${n.icon}</span>${n.label}</a>`).join('');
 document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>route(a.dataset.id));
}
function route(id){
 CUR=id;
 document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
 $('#mtitle').textContent=META[id].label;
 $('#msub').textContent=META[id].sub+(CO?(' — scoped to '+CONAME[CO]):'');
 $('#main').innerHTML='<div class="muted"><span class="spin"></span> loading…</div>';
 ({dashboard:vDash,companies:vCompanies,jobs:vJobs,ar:vAR,ap:vAP,po:vPO,inventory:vInv,crm:vCRM,vendors:vVendors,copilot:vCopilot,studio:vStudio,email:vEmail,qbsync:vQB,guide:vGuide})[id]();
}

// ---------- DASHBOARD ----------
async function vDash(){
 const s=await get('/api/overview'),g=s.group;
 const kpi=[['Open A/R',M(g.open_ar),'',''],['Overdue A/R',M(g.overdue_ar),'needs chasing','red'],
   ['Un-billed work',M(g.under_billed),'done, not invoiced','green'],['Open A/P',M(g.open_ap),'bills to pay','amber'],
   ['DSO',g.dso_days+'d',g.over_budget_job_count+' jobs over budget','blue'],['Inventory',M(g.inventory_value),'City Seafood','']];
 let co=`<tr><th>Company</th><th>Industry</th><th class="num">Jobs</th><th class="num">Contract</th><th class="num">Un-billed</th><th class="num">Open A/R</th><th class="num">Overdue</th></tr>`;
 s.companies.forEach(c=>co+=`<tr><td><b>${c.name}</b></td><td class="muted">${c.industry}</td><td class="num">${c.active_jobs}</td><td class="num">${M(c.contract_value)}</td><td class="num amt green">${c.under_billed>0?M(c.under_billed):'—'}</td><td class="num">${M(c.open_ar)}</td><td class="num amt ${c.overdue_ar>0?'red':''}">${c.overdue_ar>0?M(c.overdue_ar):'—'}</td></tr>`);
 $('#main').innerHTML=`
  <div class="kpis">${kpi.map(k=>`<div class="kpi ${k[3]}"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="card"><h2>🏢 Companies <span class="tag">${s.companies.length} entities</span></h2>${tbl('',co).replace('<tr></tr>','')}</div>
  <div class="grid2">
   <div class="card"><h2>📅 A/R Aging</h2><div style="padding:14px 16px">${agingBars(s.aging.overall)}</div></div>
   <div class="card"><h2>💳 A/P Aging</h2><div style="padding:14px 16px">${agingBars(s.ap.aging)}</div></div>
  </div>
  <div class="grid2">
   <div class="card"><h2>🚨 Over-budget jobs</h2>${s.flags.over_budget_jobs.map(j=>`<div class="flagrow"><div><b>${j.name}</b><div class="sm">${j.company_name} · ${j.pct_complete}% · margin ${j.proj_margin_pct}%</div></div><div class="amt red">+${M(j.cost_variance)}</div></div>`).join('')||'<div class="flagrow sm">All on budget</div>'}</div>
   <div class="card"><h2>⏰ Slow payers</h2>${s.flags.slow_payers.map(x=>`<div class="flagrow"><div><b>${x.customer}</b><div class="sm">${x.company}</div></div><div class="amt red">${M(x.overdue)}</div></div>`).join('')||'<div class="flagrow sm">None</div>'}</div>
  </div>`;
}
function agingBars(a){
 const o=[['current','#16a34a'],['1-30','#84cc16'],['31-60','#eab308'],['61-90','#f97316'],['90+','#dc2626']];
 const t=Object.values(a).reduce((x,y)=>x+y,0)||1;
 let bar='<div class="bar">';o.forEach(([k,c])=>{const w=a[k]/t*100;if(w>0)bar+=`<i style="width:${w}%;background:${c}"></i>`;});bar+='</div>';
 let leg='<div class="legend">';o.forEach(([k,c])=>leg+=`<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:5px"></span>${k}: <b>${M(a[k])}</b></span>`);leg+='</div>';
 return bar+leg;
}

// ---------- COMPANIES (real profiles) ----------
async function vCompanies(){
 const d=await get('/api/companies'),p=d.profiles;
 const ids=[['wayne','Wayne Contracting','General Contractor'],['vizex','Vizex','Graphics / Signage'],['mhard','Meramec Hardscapes','Concrete / Hardscaping'],['mpool','Meramec Pools & Outdoors','Pools / Outdoor Living'],['csw','City Seafood (Wholesale)','Wholesale Seafood'],['csr','City Seafood (Retail)','Retail Seafood'],['arch','Arch City Group','Restaurant Franchise']];
 let html=`<div class="card" style="padding:14px 16px"><b>${p.holding.name}</b> · Owner <b>${p.holding.owner}</b> · ${p.holding.hq}<div class="muted" style="margin-top:4px">${p.holding.about}</div></div><div class="profiles">`;
 ids.forEach(([id,name,ind])=>{const c=p[id]||{};const rows=[];
   if(c.founded)rows.push(['Founded',c.founded]); if(c.status)rows.push(['Status',c.status]);
   if(c.leadership)rows.push(['Leadership',c.leadership]); if(c.services)rows.push(['Services',c.services.join(', ')]);
   if(c.sectors)rows.push(['Sectors',c.sectors.join(', ')]); if(c.reach)rows.push(['Reach',c.reach]);
   if(c.facility)rows.push(['Facility',c.facility]); if(c.model)rows.push(['Model',c.model]);
   if(c.delivery)rows.push(['Delivery',c.delivery]); if(c.products_confirmed)rows.push(['Products',c.products_confirmed.join(', ')+' (confirmed)']);
   if(c.origin)rows.push(['Origin',c.origin]); if(c.growth)rows.push(['Growth',c.growth]); if(c.about)rows.push(['About',c.about]);
   html+=`<div class="prof"><h3>${name} <span class="realbadge">real</span></h3><div class="ind">${ind}</div>
     ${rows.map(r=>`<div class="row"><b>${r[0]}:</b> ${esc(''+r[1])}</div>`).join('')}
     <div class="src">Source: ${esc(c.source||'theburnscos.com')}</div></div>`;});
 html+='</div>';$('#main').innerHTML=html;
}

// ---------- JOB COSTING ----------
async function vJobs(){
 const d=await get('/api/jobs');
 let r=`<tr><th>Job</th><th>Company</th><th>Customer</th><th class="num">Contract</th><th class="num">%</th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Variance</th><th class="num">Margin</th><th class="num">Un-billed</th></tr>`;
 d.jobs.forEach(j=>r+=`<tr><td><b>${j.name}</b> ${j.over_budget?'<span class="pill red">over</span>':''}</td><td class="muted">${j.company_name}</td><td class="muted">${j.customer}</td><td class="num">${M(j.contract)}</td><td class="num">${j.pct_complete}%</td><td class="num">${M(j.budget_cost)}</td><td class="num">${M(j.actual_cost)}</td><td class="num amt ${j.cost_variance>0?'red':'green'}">${j.cost_variance>0?'+':''}${M(j.cost_variance)}</td><td class="num">${j.proj_margin_pct}%</td><td class="num amt ${j.under_billed>0?'green':''}">${j.under_billed>0?M(j.under_billed):'—'}</td></tr>`);
 $('#main').innerHTML=`<div class="card"><h2>🏗️ Job Costing <span class="tag">${d.jobs.length} jobs · budget vs actual</span></h2>${tbl('',r).replace('<tr></tr>','')}</div>`;
}

// ---------- AR ----------
async function vAR(){
 const d=await get('/api/ar');
 let inv=`<tr><th>Invoice</th><th>Company</th><th>Customer</th><th class="num">Amount</th><th>Status</th><th class="num">Past due</th></tr>`;
 d.open.slice(0,25).forEach(i=>inv+=`<tr><td>${i.id}</td><td class="muted">${i.company_name}</td><td>${i.customer}</td><td class="num">${F(i.amount)}</td><td><span class="pill ${i.status==='overdue'?'red':'blue'}">${i.status}</span></td><td class="num">${i.days_past_due||'—'}</td></tr>`);
 let dr=`<tr><th>Customer</th><th>Job</th><th class="num">Amount</th><th>Terms</th></tr>`;
 d.drafts.slice(0,12).forEach(x=>dr+=`<tr><td><b>${x.customer}</b> <span class="pill gray">${x.company}</span></td><td class="muted">${x.job} · ${x.pct_complete}%</td><td class="num amt green">${F(x.amount)}</td><td>Net ${x.terms_days}</td></tr>`);
 const draftTot=d.drafts.reduce((a,b)=>a+b.amount,0);
 $('#main').innerHTML=`

const CHIPS=["Which jobs are over budget?","How much can we invoice right now?","Who's slow to pay?","What's our DSO?","Give me a cash-flow summary","Which company has the most overdue A/R?"];
function vCopilot(){
 $('#main').innerHTML=`<div class="card">
   <h2>🤖 KEYSTONE Copilot <span class="tag">grounded in live numbers — never guesses</span></h2>
   <div class="chat" id="chat"><div class="msg a">Ask me anything about jobs, costs, invoices, A/P, inventory, or cash flow across all the Burns companies. Every figure I give is computed live from the books.</div></div>
   <div class="chips">${CHIPS.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
   <div class="ask"><input id="q" placeholder="Ask about costs, invoices, cash flow…" autocomplete="off"><button class="btn" id="send">Ask</button></div></div>`;
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#q').value=c.textContent;csend();});
 $('#send').onclick=csend;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')csend();});$('#q').focus();
}
function cmd(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ');}
let cbusy=false;
async function csend(){
 const q=$('#q').value.trim();if(!q||cbusy)return;cbusy=true;$('#send').disabled=true;$('#q').value='';
 const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="msg u">${cmd(q)}</div>`);
 c.insertAdjacentHTML('beforeend',`<div class="msg a" id="pend"><span class="spin"></span> checking the books…</div>`);c.scrollTop=1e9;
 try{const r=await post('/api/ask',{question:q,company:CO});$('#pend').innerHTML=cmd(r.answer||r.error||'(no answer)');$('#pend').id='';}
 catch(e){$('#pend').innerHTML='⚠️ error';}
 c.scrollTop=1e9;cbusy=false;$('#send').disabled=false;$('#q').focus();
}

const PRESETS=["Freeform gunite pool with a raised spa, tanning ledge, and natural stone decking","Modern rectangular pool with a 12-ft infinity edge, fire bowls, and a travertine patio","Family pool with a retaining wall, pergola-covered patio, and lush landscaping","Lagoon-style pool with a waterfall, boulder accents, and a built-in fire pit"];
let PHOTO=null;  // uploaded backyard photo (data URL) → enables img2img
function resizeImg(file,max){return new Promise(res=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/png'));};img.src=url;});}

 PHOTO=null;

     <div class="chips" style="padding:0 0 12px">${PRESETS.map(p=>`<span class="chip" data-p="${esc(p)}">${esc(p.slice(0,34))}…</span>`).join('')}</div>
